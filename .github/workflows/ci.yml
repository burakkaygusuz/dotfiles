name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck
          jq empty home/dot_claude/private_settings.json

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install chezmoi fish jq shellcheck

      - name: Validate zsh and fish syntax
        run: |
          zsh -n home/dot_zshrc home/dot_zshenv home/dot_config/shell/env.sh home/dot_config/shell/aliases.sh
          fish -n home/dot_config/fish/config.fish
          fish_indent --check home/dot_config/fish/config.fish

      - name: Check Brewfile parses
        run: |
          brew bundle list --file=Brewfile >/dev/null

      - name: Smoke test statusline
        run: |
          out="$(echo '{"model":{"display_name":"Claude Test"}}' | COLUMNS=100 bash home/dot_claude/executable_statusline.sh)"
          echo "$out"
          grep -q "Claude Test" <<<"$out"
          # Branch is right-aligned: visible width must be COLUMNS minus the 2-col margin.
          plain="$(printf '%s' "$out" | sed $'s/\x1b\\[[0-9;]*m//g')"
          test "$(jq -Rr length <<<"$plain")" -eq 98

      - name: Shellcheck templated scripts
        run: |
          tmp="$RUNNER_TEMP/chezmoi-test"
          rendered="$tmp/rendered"
          mkdir -p "$rendered"
          chezmoi init --source "$GITHUB_WORKSPACE" --config "$tmp/chezmoi.toml" --persistent-state "$tmp/state.boltdb" \
            --promptString "Git email (also the SSH key label)=ci@example.com" \
            --promptString "Keychain secret names, space-separated (may be empty)="
          for f in home/.chezmoiscripts/*.tmpl; do
            chezmoi execute-template --source "$GITHUB_WORKSPACE" --config "$tmp/chezmoi.toml" \
              <"$f" >"$rendered/$(basename "${f%.tmpl}")"
          done
          shellcheck "$rendered"/run_*.sh

      - name: Apply and verify dotfiles into a temp destination
        run: |
          tmp="$RUNNER_TEMP/chezmoi-test"
          mkdir -p "$tmp/dest"
          cz=(chezmoi --source "$GITHUB_WORKSPACE" --destination "$tmp/dest" \
            --config "$tmp/chezmoi.toml" --persistent-state "$tmp/state.boltdb")
          "${cz[@]}" apply --exclude=scripts
          "${cz[@]}" verify --exclude=scripts
          git config --file "$tmp/dest/.gitconfig" --list >/dev/null
