name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck
          shellcheck -s bash dot_claude/modify_settings.json

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install chezmoi fish jq

      - name: Validate shell syntax (bash, zsh, fish)
        run: |
          bash -n ssh/setup-github-ssh.sh
          zsh -n dot_zshrc
          fish -n dot_config/fish/config.fish
          fish_indent --check dot_config/fish/config.fish

      - name: Check Brewfile parses
        run: |
          brew bundle list --file=Brewfile >/dev/null

      - name: Smoke test statusline
        run: |
          out="$(echo '{"model":{"display_name":"Claude Test"}}' | bash dot_claude/executable_statusline.sh)"
          echo "$out"
          test -n "$out"
          grep -q "Claude Test" <<<"$out"

      - name: Apply dotfiles
        run: |
          make apply

      - name: Verify idempotency with chezmoi
        run: |
          chezmoi verify --source "$GITHUB_WORKSPACE"

      - name: Verify installed dotfiles existence
        run: |
          test -f "$HOME/.zshrc"
          test -f "$HOME/.gitconfig"
          test -f "$HOME/.gitignore_global"
          test -f "$HOME/.config/starship.toml"
          test -f "$HOME/.config/fish/config.fish"

      - name: Verify no unmanaged files leaked into HOME
        run: |
          ! test -e "$HOME/ssh"
          ! test -e "$HOME/.github"
          ! test -e "$HOME/LICENSE"
          ! test -e "$HOME/README.md"
          ! test -e "$HOME/Makefile"
          ! test -e "$HOME/Brewfile"

      - name: Verify git and SSH configuration parsing
        run: |
          git config --list >/dev/null
          ssh -G git@github.com | grep -E '^(hostname|user|identityfile|identitiesonly)' || true
